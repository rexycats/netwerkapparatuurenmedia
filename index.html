<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Netwerkapparatuur en media</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Layout: zelfde reeks als Netwerklab: kop, vier modi, zijnavigatie + werkkaart. Accent: signaallamp (amber) op kabelblauw/teal */
:root{
  --bg:#EDF1F3; --surface:#FFFFFF; --surface-2:#E4EAEE; --ink:#13233F; --ink-2:#4B5A6E; --line:#CDD6DC;
  --teal:#0B7A7C; --teal-ink:#FFFFFF; --teal-soft:#D5ECEC;
  --lamp:#F2A93B; --lamp-ink:#2E1C00; --lamp-soft:#FBEBCF;
  --good:#256B43; --good-bg:#E1F1E7; --bad:#A83232; --bad-bg:#F7E3E1; --info-bg:#E6ECF4;
  --term-bg:#13233F; --term-ink:#DCE6F2; --term-lab:#F2A93B;
  --mono:'JetBrains Mono', ui-monospace, 'Courier New', monospace;
  --sans:'Rubik', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0C1422; --surface:#141F33; --surface-2:#1B2940; --ink:#E6ECF4; --ink-2:#9DAEC3; --line:#283954;
    --teal:#3CC0BD; --teal-ink:#05201F; --teal-soft:#123B3D;
    --lamp:#F4B24A; --lamp-ink:#2A1800; --lamp-soft:#3A2A10;
    --good:#6FD39A; --good-bg:#12301F; --bad:#F08A80; --bad-bg:#3A1B1B; --info-bg:#1B2940;
    --term-bg:#070D18; --term-ink:#DCE6F2; --term-lab:#F4B24A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C1422; --surface:#141F33; --surface-2:#1B2940; --ink:#E6ECF4; --ink-2:#9DAEC3; --line:#283954;
  --teal:#3CC0BD; --teal-ink:#05201F; --teal-soft:#123B3D;
  --lamp:#F4B24A; --lamp-ink:#2A1800; --lamp-soft:#3A2A10;
  --good:#6FD39A; --good-bg:#12301F; --bad:#F08A80; --bad-bg:#3A1B1B; --info-bg:#1B2940;
  --term-bg:#070D18; --term-ink:#DCE6F2; --term-lab:#F4B24A;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
code,.mono{font-family:var(--mono);font-weight:700;font-size:.92em}
h1,h2,h3{text-wrap:balance;line-height:1.2}
.app{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:20px 56px;display:flex;flex-direction:column;gap:20px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px}
.brand{display:flex;align-items:center;gap:12px}
.logo{font-family:var(--mono);font-weight:700;background:var(--ink);color:var(--lamp);width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:17px;flex:none}
.name{margin:0;font-weight:700;font-size:20px;letter-spacing:-.01em}
.tag{margin:0;color:var(--ink-2);font-size:14px}
.stats{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stat{display:inline-flex;align-items:baseline;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-variant-numeric:tabular-nums}
.stat .k{font-size:13px;color:var(--ink-2)}
.stat b{font-family:var(--mono);font-size:16px}
.ghost{background:none;border:none;color:var(--ink-2);font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:6px 4px}
.seg{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;overflow-x:auto}
.seg button{flex:1;min-width:max-content;background:none;border:none;border-radius:10px;padding:10px 16px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:8px}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.seg .lock{font-family:var(--mono);font-size:12px;font-weight:700;background:var(--lamp-soft);color:var(--ink);border-radius:6px;padding:1px 6px}
.seg button[aria-selected="true"] .lock{background:var(--lamp);color:var(--lamp-ink)}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
.nav{display:flex;flex-direction:column;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);max-height:calc(100vh - 32px);overflow:auto;padding-bottom:8px}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-label{margin:0 0 4px 12px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.nav-item{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:8px 12px;font-size:15px}
.nav-item:hover{background:var(--surface)}
.nav-item[aria-current="true"]{background:var(--teal-soft);border-color:var(--teal);font-weight:600}
.badge{font-family:var(--mono);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.badge.ok{color:var(--good)}
.req{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--lamp);margin-right:6px;vertical-align:middle}
.main{display:flex;flex-direction:column;gap:20px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;min-width:0}
.eyebrow{margin:0;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}
.card h2{margin:4px 0 0;font-size:26px}
.card h3{margin:0;font-size:19px}
.lead{color:var(--ink-2);margin:6px 0 0;max-width:68ch}
.sec{display:flex;flex-direction:column;gap:12px;padding-top:20px;margin-top:20px;border-top:1px solid var(--line)}
.sec p{margin:0;max-width:72ch}
.note{background:var(--lamp-soft);border-radius:10px;padding:10px 14px;font-weight:600}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:0}
.kv-i{background:var(--surface-2);border-radius:10px;padding:12px 14px;min-width:0}
.kv dt{font-weight:600;color:var(--teal)}
.kv dd{margin:4px 0 0;font-size:15px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th{background:var(--ink);color:var(--surface);text-align:left;font-weight:600;padding:8px 12px;white-space:nowrap}
td{padding:7px 12px;border-top:1px solid var(--line);vertical-align:top}
tbody tr:nth-child(even) td{background:var(--surface-2)}
.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
pre.term{margin:0;background:var(--term-bg);color:var(--term-ink);font-family:var(--mono);font-size:13.5px;line-height:1.6;border-radius:10px;padding:14px 16px;overflow-x:auto;white-space:pre}
pre.term .tl{display:block;color:var(--term-lab);font-weight:700;margin-bottom:4px;font-family:var(--sans)}
.quiz{display:flex;flex-direction:column;gap:16px}
.qz{display:flex;flex-direction:column;gap:8px}
.qq{margin:0;font-weight:600}
.choices{display:grid;gap:8px}
.choice{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:baseline}
.choice:hover:not(:disabled){border-color:var(--teal)}
.choice .l{font-family:var(--mono);font-weight:700;color:var(--teal)}
.choice.sel{border-color:var(--teal);background:var(--teal-soft)}
.choice.right{border-color:var(--good);background:var(--good-bg)}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)}
.choice:disabled{cursor:default}
.fb{border-radius:10px;padding:12px 16px;display:flex;flex-direction:column;gap:4px}
.fb.good{background:var(--good-bg);color:var(--ink)}
.fb.bad{background:var(--bad-bg);color:var(--ink)}
.fb.info{background:var(--info-bg)}
.fb b.t{color:var(--good)}
.fb.bad b.t{color:var(--bad)}
.fb p{margin:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{background:var(--teal);color:var(--teal-ink);border:none;border-radius:10px;padding:10px 18px;font-weight:600}
.btn.sec2{background:var(--surface-2);color:var(--ink)}
.btn.lamp{background:var(--lamp);color:var(--lamp-ink)}
.btn:disabled{opacity:.5;cursor:default}
.inp{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-width:0;width:100%;max-width:340px}
.inp.mono{font-family:var(--mono)}
.inp:focus{border-color:var(--teal);outline:none}
.prompt{font-size:18px;margin:0;max-width:72ch}
.qhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;border-radius:999px;padding:3px 10px;background:var(--surface-2);color:var(--ink-2);font-weight:500}
.pill.req{width:auto;height:auto;background:var(--lamp-soft);color:var(--ink);margin:0}
.qbody{display:flex;flex-direction:column;gap:16px;margin-top:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px}
.chip.ok{background:var(--good-bg);border-color:var(--good)}
.progress{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.pi{display:flex;justify-content:space-between;gap:8px;background:var(--surface-2);border-radius:8px;padding:8px 12px;font-size:14px}
.pi b{font-family:var(--mono)}
.pi.ok{background:var(--good-bg)}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 16px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:14px;font-weight:600}
.field .help{font-size:13px;color:var(--ink-2)}
.field .inp{max-width:none}
.chk{font-size:14px;margin:0;display:flex;gap:8px;align-items:baseline}
.chk.ok::before{content:"✓";color:var(--good);font-weight:700}
.chk.warn::before{content:"!";color:var(--bad);font-weight:700;font-family:var(--mono)}
.chk.tip::before{content:"i";color:var(--teal);font-weight:700;font-family:var(--mono)}
.op{display:flex;flex-direction:column;gap:12px;padding-top:20px;margin-top:20px;border-top:1px solid var(--line)}
.op-head{display:flex;gap:12px;align-items:center}
.op-n{font-family:var(--mono);font-weight:700;background:var(--ink);color:var(--lamp);border-radius:8px;width:32px;height:32px;display:grid;place-items:center;flex:none}
.big{font-family:var(--mono);font-size:44px;font-weight:700;line-height:1}
.result{display:flex;flex-wrap:wrap;gap:20px;align-items:center}
.rev{display:flex;flex-direction:column;gap:10px}
.rv{border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.rv.ok{border-color:var(--good)}
.rv.no{border-color:var(--bad)}
.rv p{margin:0}
.small{font-size:14px;color:var(--ink-2)}
.copybox{width:100%;min-height:140px;font-family:var(--mono);font-size:13px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface-2);resize:vertical}
.gloss{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px 20px;margin:0}
.gloss div{padding:8px 0;border-bottom:1px solid var(--line)}
.gloss dt{font-weight:600}
.gloss dd{margin:2px 0 0;font-size:15px;color:var(--ink-2)}
.testbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .nav{position:static;max-height:none;flex-direction:row;overflow-x:auto;gap:12px}
  .nav-group{flex:none;min-width:220px}
}
@media (max-width:480px){
  .app{padding-inline:16px}
  .seg{display:grid;grid-template-columns:1fr 1fr}
  .card{padding:18px}
  .big{font-size:36px}
}
@media (prefers-reduced-motion:no-preference){
  .fb{animation:pop .18s ease-out}
  @keyframes pop{from{transform:translateY(4px);opacity:.4}to{transform:none;opacity:1}}
}
</style>

<script>
const CH=[{"n": 0, "les": 3, "t": "Opfrissing IPv4", "s": [{"t": "IPv4 herhaald", "h": "<p>Eerst een korte herhaling van IPv4. Bij /24 zijn de eerste 3 getallen het netwerkdeel: 192.168.1. Het adres begint met 192.168, dus het is privé. De standaardgateway is het adres van de router. In dit werkblad zie je hoe die router er in het echt uitziet, en welke andere kastjes er nog in een netwerk zitten.</p><div class=\"terms\"><pre class=\"term\">IPv4-adres. . . . : 192.168.1.23\nSubnetmasker . . : 255.255.255.0\nStandaardgateway : 192.168.1.1</pre></div><dl class=\"kv\"><div class=\"kv-i\"><dt>Netwerkdeel</dt><dd>192.168.1: de straat</dd></div><div class=\"kv-i\"><dt>Soort adres</dt><dd>privé: begint met 192.168</dd></div><div class=\"kv-i\"><dt>Gateway</dt><dd>192.168.1.1: het adres van de router</dd></div></dl>"}], "quiz": []}, {"n": 1, "les": 3, "t": "Netwerkkaart en MAC-adres", "s": [{"t": "NIC: de netwerkkaart", "h": "<p>Elk toestel in een netwerk heeft een netwerkkaart nodig: de NIC, Network Interface Card. Dat is de deur van je pc naar het netwerk. Er bestaan vaste netwerkkaarten met een poort voor een kabel, en draadloze met antennes voor wifi. In een laptop of gsm zit ze ingebouwd. Servers hebben vaak meerdere netwerkkaarten. Met teaming laat je die samenwerken als één kaart: dat geeft meer snelheid, en als één kaart of kabel uitvalt, werkt de andere gewoon verder.</p><dl class=\"kv\"><div class=\"kv-i\"><dt>Vast</dt><dd>Een poort voor de netwerkkabel (RJ45). Vroeger een insteekkaart, nu meestal ingebouwd op het moederbord.</dd></div><div class=\"kv-i\"><dt>Draadloos</dt><dd>Een wifi-kaart met antennes, ingebouwd in elke laptop en gsm, of als USB-stick.</dd></div><div class=\"kv-i\"><dt>Teaming</dt><dd>Twee of meer netwerkkaarten werken samen als één: sneller én reserve als er één uitvalt.</dd></div></dl><p class=\"note\">NIC = Network Interface Card</p>"}, {"t": "Het MAC-adres", "h": "<p>Hoe herkent een netwerk elke netwerkkaart? Met het MAC-adres. Dat is 48 bits lang en wordt geschreven als 6 paren hexa, zoals 00-A0-CC-23-AF-4A. De eerste 3 paren zijn de OUI: een nummer dat de IEEE aan elke fabrikant geeft. Intel, Asus, Apple hebben elk hun eigen OUI. De laatste 3 paren kiest de fabrikant zelf, voor elke kaart een ander. Zo wordt elk MAC-adres uniek. Je kan de fabrikant opzoeken door de eerste 3 paren in te geven in een MAC-lookup-website.</p><div class=\"tw\"><table><thead><tr><th>00-A0-CC</th><th>23-AF-4A</th></tr></thead><tbody><tr><td>OUI: de fabrikant, uitgedeeld door de IEEE</td><td>serienummer, gekozen door de fabrikant</td></tr></tbody></table></div><p><b>48 bits</b> = 6 paren hexa. De eerste helft zegt wie de kaart maakte, de tweede helft is uniek per kaart. Zo bestaat elk MAC-adres maar één keer.</p>"}, {"t": "Wie gebruikt het MAC-adres?", "h": "<p>Het MAC-adres wordt in het lokale netwerk gebruikt. Een switch onthoudt welk MAC-adres op welke poort zit. Een DHCP-server kan met het MAC-adres een vaste IP-reservatie maken: dat toestel krijgt dan altijd hetzelfde adres. Een router of access point kan een MAC-filter gebruiken: alleen gekende toestellen mogen erop. Buiten je eigen netwerk, op het internet, wordt het MAC-adres niet gebruikt: daar telt het IP-adres. Opgelet: gsm's en laptops gebruiken vaak een willekeurig MAC-adres per wifi-netwerk. Dat is goed voor je privacy, maar dan werkt een reservatie of filter niet.</p><dl class=\"kv\"><div class=\"kv-i\"><dt>Switch</dt><dd>onthoudt op welke poort elk MAC-adres zit, en stuurt data alleen daarheen</dd></div><div class=\"kv-i\"><dt>DHCP-server</dt><dd>kan een MAC-adres altijd hetzelfde IP-adres geven: een reservatie</dd></div><div class=\"kv-i\"><dt>Router of AP</dt><dd>kan alleen gekende MAC-adressen toelaten: een MAC-filter</dd></div></dl><p><b>Let op:</b> een gsm gebruikt vaak een <b>willekeurig MAC-adres</b> per wifi-netwerk, om privacyredenen. Een reservatie of filter werkt dan niet meer.</p>"}, {"t": "MAC-adres vinden", "h": "<p>In Windows vind je het MAC-adres op verschillende manieren. In de opdrachtprompt met ipconfig /all: kijk naar de regel Fysiek adres. Of met getmac /v: dat toont alle netwerkkaarten. Of via Instellingen, Netwerk en internet, je adapter, Hardware-eigenschappen. Op een gsm staat het bij Instellingen, Info of Over de telefoon, Wifi-adres. Een printer drukt een configuratiepagina af. En op routers en netwerkkaarten staat het vaak op een sticker.</p><dl class=\"kv\"><div class=\"kv-i\"><dt>ipconfig /all</dt><dd>regel <b>Fysiek adres</b> bij je adapter</dd></div><div class=\"kv-i\"><dt>getmac /v</dt><dd>alle netwerkkaarten met hun MAC-adres</dd></div><div class=\"kv-i\"><dt>Instellingen</dt><dd>Netwerk en internet › Wifi of Ethernet › Hardware-eigenschappen</dd></div><div class=\"kv-i\"><dt>Andere toestellen</dt><dd>gsm: Instellingen › Info › Wifi-adres. Printer: configuratiepagina. Op het kastje: sticker.</dd></div></dl>"}], "quiz": [{"q": "Je zoekt de fabrikant van een netwerkkaart. Welk deel van het MAC-adres gebruik je?", "o": ["De eerste 3 paren (OUI)", "De laatste 3 paren", "Het hele IP-adres"], "a": 0, "w": "De eerste 3 paren zijn de OUI: die geeft de IEEE aan elke fabrikant. Zoek ze op met een MAC-lookup."}]}, {"n": 2, "les": 3, "t": "Hub, switch en bridge", "s": [{"t": "Hub of switch?", "h": "<p>Een hub en een switch verbinden allebei toestellen met kabels. Maar een hub is dom: alles wat binnenkomt, stuurt hij naar alle poorten. Dat is zoals een omroep in de school: iedereen hoort het. Een switch is slim: hij onthoudt in een MAC-tabel welk MAC-adres op welke poort zit, en stuurt data alleen naar de juiste poort. Zoals een brief in het juiste postvak. Daarom werkt een hub op laag 1 (alleen signalen) en een switch op laag 2 (MAC-adressen). Hubs worden vandaag bijna niet meer verkocht.</p><dl class=\"kv\"><div class=\"kv-i\"><dt>Hub · laag 1</dt><dd>Stuurt alles wat binnenkomt naar <b>alle</b> poorten. Iedereen krijgt alles, ook wat niet voor hem bedoeld is. Traag en verouderd.</dd></div><div class=\"kv-i\"><dt>Switch · laag 2</dt><dd>Leert welk <b>MAC-adres</b> op welke poort zit (MAC-tabel) en stuurt data <b>alleen</b> naar de juiste poort. Sneller en veiliger.</dd></div></dl><p class=\"note\">Hub = omroep in de school · switch = een brief in het juiste postvak</p>"}, {"t": "De bridge", "h": "<p>Een bridge, of brug, verbindt twee stukken netwerk, segmenten, tot één netwerk. De bridge kijkt naar het MAC-adres: wat voor de andere kant bedoeld is, laat hij door, de rest houdt hij tegen. Zo werkt hij op laag 2, net als een switch. Eigenlijk is een switch een bridge met heel veel poorten. Je kent bridges ook in het dagelijks leven: een powerline-adapter verbindt je netwerk via het stopcontact, en een draadloze bridge verbindt twee gebouwen.</p><p><b>Segment A</b> (pc's van lokaal A)  →  <b>Bridge</b> (laat alleen door wat naar de overkant moet)  →  <b>Segment B</b> (pc's van lokaal B)</p><p>Een bridge verbindt twee netwerksegmenten tot één netwerk, en kijkt net als een switch naar het <b>MAC-adres</b> (laag 2). Een switch is eigenlijk een bridge met veel poorten. Voorbeelden: een draadloze bridge tussen twee gebouwen, een powerline-adapter.</p>"}, {"t": "Soorten switches", "h": "<p>Er zijn twee soorten switches. Een unmanaged switch steek je in en hij werkt: je kan niets instellen. Dat is wat de meeste mensen thuis hebben. Een managed switch kan je instellen via een webpagina. Dan kan je bijvoorbeeld VLAN's maken (aparte netwerken voor leerlingen en leerkrachten), voorrang geven aan bepaald verkeer (QoS), poorten uitschakelen en zien hoeveel verkeer er is. Bedrijven en scholen gebruiken managed switches, omdat ze het netwerk willen beheren en beveiligen. Daarnaast heb je laag 2- en laag 3-switches. Een laag 2-switch werkt alleen met MAC-adressen. Een laag 3-switch kan ook routeren: verkeer tussen verschillende netwerken doorsturen op basis van IP-adressen. Routeren betekent: de weg zoeken naar een ander netwerk.</p><div class=\"tw\"><table><thead><tr><th></th><th>Unmanaged</th><th>Managed</th></tr></thead><tbody><tr><td>Instellen</td><td>kan niet: plug and play</td><td>via een webpagina of commando's</td></tr><tr><td>Extra's</td><td>geen</td><td>VLAN's, QoS, monitoring, poorten uitzetten, PoE-beheer</td></tr><tr><td>Prijs</td><td>goedkoop</td><td>duurder</td></tr><tr><td>Waar?</td><td>thuis</td><td>bedrijven en scholen</td></tr></tbody></table></div><p><b>Laag 2-switch:</b> schakelt op MAC-adres. <b>Laag 3-switch:</b> kan daarnaast ook <b>routeren</b>: verkeer tussen verschillende netwerken (op IP-adres) doorsturen.</p>"}, {"t": "Switch kopen", "h": "<p>Stel: je hebt thuis te weinig poorten op je router en je koopt een switch. Waar let je op? Hoeveel poorten heb je nodig, en hoe snel moeten ze zijn: 1 gigabit is de standaard. Moet de switch toestellen van stroom voorzien via de kabel? Dat heet PoE, Power over Ethernet, handig voor camera's en access points. Wil je hem kunnen instellen? Dan neem je een managed switch. Moet hij ook routeren? Dan een laag 3-switch. En past hij op je bureau of in een serverkast (rack)?</p><dl class=\"kv\"><div class=\"kv-i\"><dt>Aantal poorten</dt><dd>5, 8, 16, 24 of 48</dd></div><div class=\"kv-i\"><dt>Snelheid</dt><dd>1 Gbit/s, 2,5 of 10 Gbit/s</dd></div><div class=\"kv-i\"><dt>PoE</dt><dd>stroom via de kabel voor camera's en access points</dd></div><div class=\"kv-i\"><dt>Managed?</dt><dd>thuis niet nodig, in een bedrijf wel</dd></div><div class=\"kv-i\"><dt>Laag 2 of 3</dt><dd>moet hij ook routeren?</dd></div><div class=\"kv-i\"><dt>Behuizing</dt><dd>klein bureaumodel of 19 inch voor een rack</dd></div></dl>"}], "quiz": [{"q": "Een bedrijf wil aparte netwerken voor personeel en gasten op dezelfde switch. Wat kopen ze?", "o": ["Een hub", "Een unmanaged switch", "Een managed switch"], "a": 2, "w": "Met een managed switch kan je VLAN's maken: aparte netwerken op dezelfde hardware."}]}, {"n": 3, "les": 3, "t": "Router, modem en gateway", "s": [{"t": "Modem of router?", "h": "<p>Een modem en een router worden vaak verward. De modem brengt het internet naar je huis: hij zet het signaal van de lijn van je provider om naar gewone netwerkdata. Die lijn kan een telefoonlijn zijn (DSL), een coaxkabel (zoals bij Telenet) of glasvezel. De modem heeft het publieke IP-adres en zit aan de kant van het WAN, het grote netwerk. De router brengt het internet naar je toestellen: hij maakt je thuisnetwerk, het LAN, deelt privé-IP-adressen uit met DHCP en vertaalt ze met NAT. Modem is de voordeur van de straat naar je huis, de router is de gang die naar elke kamer leidt.</p><div class=\"tw\"><table><thead><tr><th>Modem</th><th>Router</th></tr></thead><tbody><tr><td>brengt het internet <b>naar je huis</b></td><td>brengt het internet <b>naar je toestellen</b></td></tr><tr><td>zet het signaal van de lijn om (telefoonlijn, coax, glasvezel)</td><td>verbindt netwerken en zoekt de weg (laag 3)</td></tr><tr><td>heeft het <b>publieke</b> IP-adres</td><td>deelt <b>privé</b>-IP-adressen uit (DHCP) en doet NAT</td></tr><tr><td>werkt aan de kant van het WAN</td><td>maakt je LAN</td></tr></tbody></table></div><p><b>Internet</b> (provider)  →  <b>Modem</b> (signaal omzetten)  →  <b>Router</b> (LAN, DHCP, NAT)  →  <b>Toestellen</b> (pc, gsm, tv)</p>"}, {"t": "Alles-in-één", "h": "<p>Thuis heb je meestal één kastje van je provider, zoals de Bbox van Proximus of de modem van Telenet. Dat is een alles-in-één-toestel: een modem, een router, een switch met een paar poorten achteraan, een access point voor wifi en een firewall in één doos. Bedrijven gebruiken liever aparte toestellen: de modem van de provider, een eigen firewall, managed switches en meerdere access points. Dat is krachtiger, veiliger en makkelijker uit te breiden.</p><dl class=\"kv\"><div class=\"kv-i\"><dt>Modem</dt><dd>zet het signaal van de lijn om</dd></div><div class=\"kv-i\"><dt>Router</dt><dd>NAT en DHCP: maakt je thuisnetwerk</dd></div><div class=\"kv-i\"><dt>Switch</dt><dd>4 LAN-poorten achteraan</dd></div><div class=\"kv-i\"><dt>Access point</dt><dd>maakt het wifi-netwerk</dd></div><div class=\"kv-i\"><dt>Firewall</dt><dd>blokkeert ongevraagd verkeer van buiten</dd></div><div class=\"kv-i\"><dt>Bedrijven</dt><dd>aparte toestellen: modem, firewall, switches, AP's</dd></div></dl>"}, {"t": "NAT of bridge-modus", "h": "<p>Je kent NAT al: de router vertaalt privéadressen naar één publiek adres. Een modem van je provider kan in twee standen staan. In router-modus doet het kastje alles zelf: NAT, DHCP en wifi. Zo staat het bij bijna iedereen. In bridge-modus doet het kastje alleen nog het werk van een modem en geeft het publieke adres door aan een eigen router of firewall erachter. Waarom zou je dat doen? Omdat je een betere eigen router of firewall wil gebruiken, en omdat je geen dubbele NAT wil: twee routers achter elkaar die allebei vertalen, dat geeft problemen met bijvoorbeeld gamen en VPN.</p><dl class=\"kv\"><div class=\"kv-i\"><dt>Router-modus (NAT)</dt><dd>Het kastje van de provider doet alles: NAT, DHCP, wifi. Zo staat het bij bijna iedereen thuis.</dd></div><div class=\"kv-i\"><dt>Bridge-modus</dt><dd>Het kastje werkt <b>alleen als modem</b> en geeft het publieke adres door aan je <b>eigen router</b> of firewall. Die doet dan NAT.</dd></div></dl><p>Waarom bridge? Je wil een betere eigen router of firewall gebruiken, en geen <b>dubbele NAT</b> (twee routers achter elkaar die allebei vertalen).</p>"}, {"t": "Gateway, pc en server", "h": "<p>Een gateway is een toestel dat twee verschillende netwerken met elkaar verbindt, bijvoorbeeld je thuisnetwerk en het internet. De default gateway die je in ipconfig ziet, is het adres van de router: de deur naar buiten. Je doelstellingen vragen ook het verschil tussen een pc en een server. Een pc is voor één gebruiker. Een server biedt diensten aan vele anderen: bestanden delen, e-mail, een website. Daarom draait een server dag en nacht, en heeft hij reserve-onderdelen zoals een dubbele voeding en meerdere schijven in RAID, zodat hij blijft werken als er iets stukgaat.</p><dl class=\"kv\"><div class=\"kv-i\"><dt>Gateway</dt><dd>Een toestel dat twee <b>verschillende</b> netwerken verbindt. De <b>default gateway</b> in ipconfig is het adres van de router: de deur naar buiten.</dd></div><div class=\"kv-i\"><dt>Pc</dt><dd>Voor één gebruiker. Gewone onderdelen, staat uit als je klaar bent.</dd></div><div class=\"kv-i\"><dt>Server</dt><dd>Biedt <b>diensten</b> aan vele anderen: bestanden, mail, websites. Draait 24/7, met reserve-onderdelen: dubbele voeding, RAID.</dd></div></dl>"}, {"t": "Andere kastjes", "h": "<p>Er zijn nog andere kastjes. Een access point maakt een wifi-netwerk en verbindt draadloze toestellen met het bekabelde netwerk. Een repeater vangt het wifi-signaal op en zendt het opnieuw uit: zo bereik je verder, maar de snelheid zakt vaak. Een powerline-adapter gebruikt de elektriciteitskabels in je huis als netwerkkabel: je steekt een adapter in het stopcontact bij de router en een tweede in een andere kamer. Een PoE-injector stopt stroom in de netwerkkabel, zodat een access point of camera aan het plafond geen stopcontact nodig heeft. Deze toestellen zie je terug bij de oefening 'benoem'.</p><dl class=\"kv\"><div class=\"kv-i\"><dt>Access point</dt><dd>maakt wifi en verbindt draadloze toestellen met het bekabelde netwerk</dd></div><div class=\"kv-i\"><dt>Repeater</dt><dd>vangt het wifi-signaal op en zendt het opnieuw uit: groter bereik, vaak lagere snelheid</dd></div><div class=\"kv-i\"><dt>Powerline</dt><dd>netwerk via het stopcontact: een adapter bij de router, een andere in een andere kamer</dd></div><div class=\"kv-i\"><dt>PoE-injector</dt><dd>stopt stroom in de netwerkkabel, voor een access point of camera zonder stopcontact</dd></div></dl>"}], "quiz": [{"q": "Welk toestel deelt thuis de privé-IP-adressen uit?", "o": ["De modem", "De router (DHCP)", "De switch"], "a": 1, "w": "De router is meestal de DHCP-server. De modem brengt het internet binnen, de switch kijkt alleen naar MAC-adressen."}]}, {"n": 4, "les": 3, "t": "Firewall en poorten", "s": [{"t": "Firewall", "h": "<p>Een firewall is de portier van je netwerk. Hij bekijkt elk pakketje en beslist met regels of het binnen of buiten mag, op basis van het IP-adres, de poort en het protocol. Er zijn regels voor binnenkomend verkeer, inbound, en voor uitgaand verkeer, outbound. Een hardware-firewall is een apart toestel dat het hele netwerk beschermt. Bekende merken zijn Fortinet met de FortiGate, Palo Alto, Cisco, Sophos, Check Point en WatchGuard. Een software-firewall is een programma op één pc, zoals de Windows Defender Firewall.</p><dl class=\"kv\"><div class=\"kv-i\"><dt>Wat doet hij?</dt><dd>Bekijkt elk pakketje en beslist met <b>regels</b>: doorlaten of blokkeren, op basis van IP-adres, poort en protocol.</dd></div><div class=\"kv-i\"><dt>Inbound</dt><dd>regels voor verkeer dat <b>binnenkomt</b></dd></div><div class=\"kv-i\"><dt>Outbound</dt><dd>regels voor verkeer dat <b>buitengaat</b></dd></div></dl><dl class=\"kv\"><div class=\"kv-i\"><dt>Hardware-firewall</dt><dd>apart toestel dat het <b>hele netwerk</b> beschermt. Merken: Fortinet, Palo Alto, Cisco, Sophos, Check Point, WatchGuard.</dd></div><div class=\"kv-i\"><dt>Software-firewall</dt><dd>programma op <b>één pc</b>: Windows Defender Firewall, of als deel van een antivirus.</dd></div></dl>"}, {"t": "Functies van een firewall", "h": "<p>Een bedrijfsfirewall doet veel meer dan blokkeren. Met VPN kunnen medewerkers van thuis veilig inloggen. Een webfilter blokkeert bepaalde websites. Antivirus en IPS, een inbraakpreventiesysteem, houden aanvallen tegen. Een gastnetwerk geeft bezoekers internet zonder toegang tot je eigen toestellen. Een DMZ, een demilitarized zone, is een aparte zone voor servers die bereikbaar moeten zijn vanaf het internet, zoals een webserver of mailserver. Raakt een hacker in de DMZ, dan zit hij nog niet in het interne netwerk. Thuis zijn een gastnetwerk, ouderlijk toezicht en port forwarding het handigst.</p><dl class=\"kv\"><div class=\"kv-i\"><dt>VPN</dt><dd>veilig van thuis inloggen op het bedrijfsnetwerk</dd></div><div class=\"kv-i\"><dt>Webfilter</dt><dd>bepaalde websites blokkeren</dd></div><div class=\"kv-i\"><dt>Antivirus en IPS</dt><dd>aanvallen en virussen tegenhouden</dd></div><div class=\"kv-i\"><dt>Gastnetwerk</dt><dd>bezoekers krijgen internet, maar geen toegang tot je eigen toestellen</dd></div><div class=\"kv-i\"><dt>DMZ</dt><dd>aparte zone voor servers die bereikbaar moeten zijn vanaf internet</dd></div><div class=\"kv-i\"><dt>Thuis handig</dt><dd>gastnetwerk, ouderlijk toezicht, port forwarding</dd></div></dl>"}, {"t": "Poorten", "h": "<p>Op één computer draaien veel diensten tegelijk. Het IP-adres is het gebouw, de poort is de deur naar een bepaalde dienst. Surfen gaat via poort 80 (HTTP) en veilig surfen via 443 (HTTPS). Mail versturen via 25 (SMTP), mail ophalen via 110 (POP3) of 143 (IMAP). DNS gebruikt poort 53, FTP 20 en 21, SSH 22, Telnet 23 en extern bureaublad 3389. Een firewall bepaalt welke deuren open staan.</p><div class=\"tw\"><table><thead><tr><th>Poort</th><th>Protocol</th><th>Waarvoor?</th><th>Poort</th><th>Protocol</th><th>Waarvoor?</th></tr></thead><tbody><tr><td><code>20/21</code></td><td>FTP</td><td>bestanden</td><td><code>80</code></td><td>HTTP</td><td>surfen</td></tr><tr><td><code>22</code></td><td>SSH</td><td>veilig op afstand</td><td><code>110</code></td><td>POP3</td><td>mail ophalen</td></tr><tr><td><code>23</code></td><td>Telnet</td><td>onveilig op afstand</td><td><code>143</code></td><td>IMAP</td><td>mail lezen</td></tr><tr><td><code>25</code></td><td>SMTP</td><td>mail versturen</td><td><code>443</code></td><td>HTTPS</td><td>veilig surfen</td></tr><tr><td><code>53</code></td><td>DNS</td><td>namen opzoeken</td><td><code>3389</code></td><td>RDP</td><td>extern bureaublad</td></tr></tbody></table></div><p>IP-adres = het gebouw · poort = het nummer van de deur. Een firewall bepaalt welke deuren open staan.</p>"}, {"t": "Netwerkprofielen in Windows", "h": "<p>De Windows Defender Firewall kent drie profielen. Domein is voor een bedrijfsnetwerk. Privé is voor een netwerk dat je vertrouwt, zoals thuis: je pc is zichtbaar en je kan bestanden en printers delen. Openbaar is voor een station of café: je pc is verborgen voor anderen. Wisselen doe je via Instellingen, Netwerk en internet, Wifi of Ethernet, je netwerk, Netwerkprofieltype. De firewall-instellingen vind je in Windows-beveiliging, Firewall en netwerkbeveiliging, of in het Configuratiescherm. De inkomende en uitgaande regels zie je bij Geavanceerde instellingen, of typ wf.msc.</p><dl class=\"kv\"><div class=\"kv-i\"><dt>Domein</dt><dd>op het bedrijfsnetwerk, beheerd door de IT-dienst</dd></div><div class=\"kv-i\"><dt>Privé</dt><dd>thuis, een netwerk dat je vertrouwt: je pc is <b>zichtbaar</b>, bestanden en printers delen kan</dd></div><div class=\"kv-i\"><dt>Openbaar</dt><dd>station, café, hotel: je pc is <b>verborgen</b> voor anderen. Veiligste keuze.</dd></div></dl><p><b>Wisselen:</b> Instellingen › Netwerk en internet › Wifi of Ethernet › je netwerk › Netwerkprofieltype. <b>Firewall:</b> Windows-beveiliging › Firewall en netwerkbeveiliging. <b>Regels:</b> Geavanceerde instellingen (<code>wf.msc</code>) › Inkomende en uitgaande regels.</p>"}, {"t": "Pc 2 ziet het netwerk niet", "h": "<p>Op pc 1 zie je in de Verkenner alle toestellen in het netwerk, op pc 2 niet. Hoe komt dat? Pc 2 staat waarschijnlijk op het profiel Openbaar, of netwerkdetectie staat uit. Dan is de pc verborgen en ziet hij ook de anderen niet. Oplossing: zet het profiel op Privé en schakel netwerkdetectie en bestandsdeling in. Nog een vraag: wat gebeurt er met de Windows-firewall als je een andere firewall installeert, bijvoorbeeld als deel van een antivirus? Die neemt het werk over en schakelt de Windows-firewall uit, want twee firewalls tegelijk zitten elkaar in de weg.</p><dl class=\"kv\"><div class=\"kv-i\"><dt>Probleem</dt><dd>Op pc 1 zie je in de Verkenner alle toestellen van het netwerk. Op pc 2 zie je niets.</dd></div><div class=\"kv-i\"><dt>Oorzaak</dt><dd>Pc 2 staat op het profiel <b>Openbaar</b>, of <b>netwerkdetectie</b> staat uit.</dd></div><div class=\"kv-i\"><dt>Oplossing</dt><dd>Zet het profiel op <b>Privé</b> en schakel netwerkdetectie en bestandsdeling in.</dd></div></dl><p><b>Extra firewall geïnstalleerd?</b> Een firewall van ZoneAlarm, Kaspersky of FortiClient neemt het werk over: de Windows-firewall wordt dan uitgeschakeld. Twee firewalls tegelijk geeft problemen.</p>"}], "quiz": [{"q": "Een bedrijf wil zijn webserver bereikbaar maken vanaf het internet, maar het interne netwerk beschermen. Waar zet je de server?", "o": ["In de DMZ", "Op het gastnetwerk", "Achter de modem in bridge"], "a": 0, "w": "De DMZ is een aparte zone voor servers die van buitenaf bereikbaar moeten zijn, gescheiden van het interne netwerk."}]}, {"n": 5, "les": 3, "t": "Apparaten opsporen", "s": [{"t": "IP-scanners", "h": "<p>Met een IP-scanner zie je welke toestellen er in een netwerk zitten. Gratis programma's zijn Advanced IP Scanner en Angry IP Scanner, en op je gsm de app Fing. Bedrijven gebruiken uitgebreidere tools zoals Lansweeper, PRTG of Microsoft SCCM: die houden een volledige inventaris bij en waarschuwen als er iets stukgaat. Een scanner toont per toestel het IP-adres, de naam, het MAC-adres en vaak de fabrikant. Belangrijk: scan alleen je eigen netwerk, of met toestemming van de beheerder. Op een vreemd netwerk scannen is niet toegelaten.</p><dl class=\"kv\"><div class=\"kv-i\"><dt>IP-scanners</dt><dd>Advanced IP Scanner, Angry IP Scanner, Fing (app op je gsm)</dd></div><div class=\"kv-i\"><dt>Uitgebreider</dt><dd>Lansweeper, PRTG, Microsoft SCCM: inventaris en monitoring voor bedrijven</dd></div><div class=\"kv-i\"><dt>Wat zie je?</dt><dd>IP-adres, naam, MAC-adres en fabrikant van elk toestel</dd></div></dl><p class=\"note\">Scan alleen je eigen netwerk, of met toestemming van de beheerder</p>"}, {"t": "Een scan lezen", "h": "<p>Zo ziet het resultaat van een scan eruit. Wat kan je afleiden? Het toestel op .1 met een naam van de provider is de router. Dat is ook de default gateway, en daar zit de firewall in. Aan de fabrikant en de naam herken je de andere toestellen: een pc, een printer, een gsm, een camera. Zo kan je ook vreemde toestellen opsporen die er niet horen. Dit voorbeeld is verzonnen, maar zo ziet het er bij jou thuis ook ongeveer uit.</p><div class=\"tw\"><table><thead><tr><th>IP-adres</th><th>Naam</th><th>Fabrikant</th><th>Wat is het?</th></tr></thead><tbody><tr><td><code>192.168.1.1</code></td><td>bbox.lan</td><td>Sagemcom</td><td>router, gateway en firewall</td></tr><tr><td><code>192.168.1.20</code></td><td>DESKTOP-KAAT</td><td>ASUSTek</td><td>een pc</td></tr><tr><td><code>192.168.1.35</code></td><td>HP-LaserJet</td><td>HP</td><td>netwerkprinter</td></tr><tr><td><code>192.168.1.52</code></td><td>Galaxy-S24</td><td>Samsung</td><td>gsm</td></tr><tr><td><code>192.168.1.60</code></td><td>—</td><td>Hikvision</td><td>IP-camera</td></tr></tbody></table></div><p>Het adres op <b>.1</b> met een naam van de provider is bijna altijd de router: daar zit ook de firewall.</p>"}, {"t": "Netwerkcommando's", "h": "<p>Dit zijn de belangrijkste netwerkcommando's. ipconfig /all toont je eigen instellingen. arp -a toont de IP- en MAC-adressen van toestellen waarmee je pc onlangs sprak: zo zie je ook andere toestellen. ping 8.8.8.8 test of je de DNS-server van Google kan bereiken. tracert www.microsoft.com toont de weg naar die website. nslookup www.ubuntu.com geeft het IP-adres van de website van Ubuntu. Met nslookup -type=mx en een domeinnaam zoek je de mailserver op, bijvoorbeeld van de gemeente Sint-Niklaas. Met telnet en een poortnummer test je of een poort open staat, en netstat -an toont welke poorten op je eigen pc open staan.</p><div class=\"tw\"><table><thead><tr><th>Commando</th><th>Wat doet het?</th></tr></thead><tbody><tr><td><code>ipconfig /all</code></td><td>je eigen instellingen, met MAC-adres</td></tr><tr><td><code>arp -a</code></td><td>IP- en MAC-adressen van toestellen waarmee je pc sprak</td></tr><tr><td><code>ping 8.8.8.8</code></td><td>kan ik de DNS-server van Google bereiken?</td></tr><tr><td><code>tracert www.microsoft.com</code></td><td>welke weg volgt het verkeer?</td></tr><tr><td><code>nslookup www.ubuntu.com</code></td><td>welk IP-adres hoort bij deze naam?</td></tr><tr><td><code>nslookup -type=mx sint-niklaas.be</code></td><td>welke mailserver hoort bij dit domein?</td></tr><tr><td><code>telnet mail.server.be 25</code></td><td>staat poort 25 open?</td></tr><tr><td><code>netstat -an</code></td><td>welke poorten staan open op mijn pc?</td></tr></tbody></table></div>"}, {"t": "Extern IP en whois", "h": "<p>Het externe IP-adres van de school vind je door in je browser 'wat is mijn IP' te zoeken. Iedereen in de klas krijgt hetzelfde adres: dat van de schoolrouter, door NAT. Wil je weten wie eigenaar is van een IP-adres? Dan doe je een whois-opzoeking, bijvoorbeeld via een website als ipinfo.io. Die toont welk bedrijf het adres beheert, bijvoorbeeld Google, Amazon of Proximus, en waar het ongeveer staat. Met nslookup en een IP-adres zoek je omgekeerd de naam op, als die bestaat.</p><dl class=\"kv\"><div class=\"kv-i\"><dt>Extern IP-adres</dt><dd>Zoek in je browser \"wat is mijn IP\". Op school krijgt iedereen hetzelfde: het publieke adres van de schoolrouter.</dd></div><div class=\"kv-i\"><dt>Eigenaar van een IP</dt><dd>Een <b>whois</b>-opzoeking (bv. via ipinfo.io) toont welk bedrijf het adres beheert en waar het staat.</dd></div><div class=\"kv-i\"><dt>Domein van een IP</dt><dd><code>nslookup</code> met een IP-adres zoekt omgekeerd de naam op, als die bestaat.</dd></div></dl>"}], "quiz": [{"q": "Je wil het MAC-adres zien van de printer waar je net naar printte. Welk commando?", "o": ["arp -a", "tracert", "netstat -an"], "a": 0, "w": "arp -a toont de IP- en MAC-adressen van toestellen waarmee je pc onlangs communiceerde."}]}, {"n": 6, "les": 4, "t": "Twisted pair", "s": [{"t": "Twisted pair", "h": "<p>De gewone netwerkkabel heet twisted pair: binnenin zitten 8 draadjes in 4 paren, en elk paar is om elkaar heen gedraaid. Dat draaien zorgt ervoor dat storing van buitenaf elkaar opheft. Er zijn drie soorten. UTP, unshielded, heeft geen afscherming: goedkoop en soepel, de kabel die je thuis gebruikt. STP, shielded, heeft rond elk paar een afscherming: voor plaatsen met veel elektrische storing, zoals een fabriek met grote machines. FTP, foiled, heeft één folie rond alle paren samen: bijvoorbeeld in liftschachten. De stekker heet RJ45, en een kabel mag maximaal 100 meter lang zijn.</p><dl class=\"kv\"><div class=\"kv-i\"><dt>UTP</dt><dd><b>Unshielded</b>: geen afscherming. Goedkoop en soepel. De gewone netwerkkabel thuis en op kantoor.</dd></div><div class=\"kv-i\"><dt>STP</dt><dd><b>Shielded</b>: elk paar heeft een eigen afscherming. Voor plaatsen met veel storing: fabrieken, grote machines.</dd></div><div class=\"kv-i\"><dt>FTP</dt><dd><b>Foiled</b>: een folie rond alle paren samen. Bv. in liftschachten en fabriekshallen.</dd></div></dl><p>Waarom getwist? Elk paar draait om elkaar heen, zodat storing van buitenaf en van de andere paren elkaar <b>opheft</b>. Stekker: <b>RJ45</b>. Maximaal <b>100 meter</b> per kabel.</p>"}, {"t": "Categorieën", "h": "<p>Netwerkkabels bestaan in categorieën. Hoe hoger de categorie, hoe hogere frequentie de kabel aankan en hoe sneller hij is. Cat 5 haalt 100 megabit en is verouderd. Cat 5e haalt 1 gigabit: dat is het minimum vandaag. Cat 6 haalt 1 gigabit, en 10 gigabit over korte afstand, tot 55 meter. Cat 6A haalt 10 gigabit over de volle 100 meter: dat is een goede keuze voor bedrijven. Cat 7 is altijd afgeschermd, en Cat 8 haalt 40 gigabit maar alleen tot 30 meter, voor datacenters.</p><div class=\"tw\"><table><thead><tr><th>Categorie</th><th>Snelheid</th><th>Frequentie</th><th>Opmerking</th></tr></thead><tbody><tr><td><code>Cat 5</code></td><td>100 Mbit/s</td><td>100 MHz</td><td>verouderd</td></tr><tr><td><code>Cat 5e</code></td><td>1 Gbit/s</td><td>100 MHz</td><td>minimum vandaag</td></tr><tr><td><code>Cat 6</code></td><td>1 Gbit/s, 10 Gbit/s tot 55 m</td><td>250 MHz</td><td>goede keuze thuis</td></tr><tr><td><code>Cat 6A</code></td><td>10 Gbit/s tot 100 m</td><td>500 MHz</td><td>bedrijven, toekomstgericht</td></tr><tr><td><code>Cat 7 / 7A</code></td><td>10 Gbit/s</td><td>600 / 1000 MHz</td><td>altijd afgeschermd</td></tr><tr><td><code>Cat 8</code></td><td>40 Gbit/s tot 30 m</td><td>1600–2000 MHz</td><td>datacenters</td></tr></tbody></table></div>"}, {"t": "Straight of cross", "h": "<p>Een netwerkkabel kan straight of cross zijn. Bij een straight kabel zitten de draadjes aan beide kanten in dezelfde volgorde. Die gebruik je tussen verschillende toestellen, zoals een pc en een switch. Bij een cross kabel zijn de draadjes om te zenden en te ontvangen omgewisseld. Die had je vroeger nodig tussen twee gelijke toestellen, zoals twee pc's of twee switches: anders zou de ene zenden in het oor van de andere die ook zendt. Vandaag hebben bijna alle toestellen auto-MDIX: ze draaien het zelf om. Daarom gebruik je in de praktijk bijna altijd een straight kabel.</p><dl class=\"kv\"><div class=\"kv-i\"><dt>Straight (recht)</dt><dd>Beide stekkers zijn hetzelfde. Voor <b>verschillende</b> toestellen: pc ↔ switch, router ↔ switch.</dd></div><div class=\"kv-i\"><dt>Cross (gekruist)</dt><dd>Zenden en ontvangen (draad 1-2 en 3-6) zijn omgewisseld. Voor <b>gelijke</b> toestellen: pc ↔ pc, switch ↔ switch.</dd></div><div class=\"kv-i\"><dt>Vandaag: auto-MDIX</dt><dd>Moderne netwerkkaarten en switches draaien het zelf om. Je gebruikt dus bijna altijd een straight kabel.</dd></div></dl>"}, {"t": "PoE", "h": "<p>Kijk eens naar het plafond van het klaslokaal: daar hangt waarschijnlijk een access point voor de wifi. Daar zit geen stopcontact. Hoe krijgt het stroom? Via de netwerkkabel. Dat heet Power over Ethernet, PoE. Een PoE-switch of een PoE-injector stopt stroom in de UTP-kabel, en het toestel aan de andere kant haalt er stroom en data uit. Zo werkt het ook bij IP-camera's en vaste telefoons op kantoor.</p><p><b>PoE-switch</b> (of PoE-injector)  →  <b>UTP-kabel</b> (data + stroom)  →  <b>Access point</b> (aan het plafond)  →  <b>IP-camera</b> (buiten aan de gevel)</p><p>Met <b>Power over Ethernet</b> heeft een access point of camera geen stopcontact nodig. Op school hangen de wifi-toestellen aan het plafond: één netwerkkabel per toestel volstaat.</p>"}], "quiz": [{"q": "Waarom zijn de draadjes in een netwerkkabel per paar getwist?", "o": ["Om de kabel soepeler te maken", "Zodat storing elkaar opheft", "Om stroom te kunnen sturen"], "a": 1, "w": "Door het twisten heffen storingen van buitenaf en tussen de paren elkaar op."}]}, {"n": 7, "les": 4, "t": "Coax en glasvezel", "s": [{"t": "Coax", "h": "<p>Een coaxkabel heeft in het midden een koperen kern, daarrond isolatie, daarrond een gevlochten mantel die als afscherming dient, en tot slot een beschermlaag. Omdat kern en mantel dezelfde as hebben, heffen de elektrische en magnetische velden elkaar op: er lekt bijna geen storing naar binnen of naar buiten. Daarom gebruik je coax voor hoogfrequente signalen, zoals het tv-signaal en het internet van Telenet. Vroeger werden ook computernetwerken met coax gemaakt: op oude netwerkkaarten zie je nog een ronde BNC-aansluiting.</p><p><b>Kern</b> (koperen geleider)  →  <b>Isolatie</b> (kunststof)  →  <b>Mantel</b> (gevlochten afscherming)  →  <b>Buitenmantel</b> (beschermlaag)</p><dl class=\"kv\"><div class=\"kv-i\"><dt>Waarom goed?</dt><dd>Kern en mantel hebben dezelfde as: de velden heffen elkaar op. Bijna geen storing naar binnen of buiten.</dd></div><div class=\"kv-i\"><dt>Waar?</dt><dd>Tv-signaal, internet van Telenet (via de coax in je huis), vroeger ook computernetwerken.</dd></div></dl>"}, {"t": "Glasvezel", "h": "<p>Glasvezel stuurt data als lichtflitsjes door een draad van glas. Er zijn twee grote types. Singlemode heeft een heel dunne kern van 9 micrometer en gebruikt een laser: het licht gaat rechtdoor, kilometers ver. Dat gebruiken providers en bedrijven tussen gebouwen. Multimode heeft een dikkere kern van 50 of 62,5 micrometer: het licht kaatst heen en weer, en dat werkt tot een paar honderd meter. Multimode heeft types van OM1 tot OM5. Er is ook plastic vezel, voor korte afstanden. Glasvezel is heel snel, gaat ver, heeft geen last van elektrische storing en geleidt geen stroom: ideaal tussen twee gebouwen. Het nadeel: duurder en breekbaarder. Stekkers heten LC, SC en ST.</p><dl class=\"kv\"><div class=\"kv-i\"><dt>Singlemode (OS1/OS2)</dt><dd>Heel dunne kern (9 µm), een laser. <b>Kilometers</b> ver: tot 40 km en meer. Voor providers en tussen gebouwen.</dd></div><div class=\"kv-i\"><dt>Multimode (OM1–OM5)</dt><dd>Dikkere kern (50 of 62,5 µm), goedkopere lichtbron. <b>Honderden meters</b>. Binnen een gebouw of campus.</dd></div><div class=\"kv-i\"><dt>Plastic (POF)</dt><dd>Plastic in plaats van glas, enkele meters. Bv. audio of in auto's.</dd></div></dl><p>Voordelen: heel snel, grote afstanden, <b>geen elektrische storing</b> en geen stroomgeleiding tussen gebouwen. Nadelen: duurder en breekbaarder. Stekkers: LC, SC, ST.</p>"}, {"t": "Glasvezeltabel", "h": "<p>Deze tabel komt uit de cursus. Hoe hoger het OM-nummer, hoe beter de multimode-vezel. Bij multimode geldt: hoe sneller, hoe korter. OM3 haalt 10 gigabit tot 300 meter, OM4 tot 400 meter. Singlemode haalt tientallen kilometers. Gebruik de tabel om een kabel te kiezen: je kijkt naar de afstand en de snelheid die je nodig hebt.</p><div class=\"tw\"><table><thead><tr><th>Type</th><th>Kern</th><th>1 Gbit/s</th><th>10 Gbit/s</th><th>40 / 100 Gbit/s</th></tr></thead><tbody><tr><td><code>OM1</code></td><td>62,5 µm</td><td>275 m</td><td>33 m</td><td>—</td></tr><tr><td><code>OM2</code></td><td>50 µm</td><td>550 m</td><td>82 m</td><td>—</td></tr><tr><td><code>OM3</code></td><td>50 µm</td><td>800 m</td><td>300 m</td><td>100 m</td></tr><tr><td><code>OM4</code></td><td>50 µm</td><td>1100 m</td><td>400 m</td><td>150 m</td></tr><tr><td><code>OM5</code></td><td>50 µm</td><td>1100 m</td><td>400 m</td><td>150 m</td></tr><tr><td><code>OS1/OS2</code></td><td>9 µm</td><td>100 km</td><td>40 km</td><td>40 km</td></tr></tbody></table></div><p>Bron: de tabel uit de cursus. Hoe sneller, hoe korter de afstand bij multimode.</p>"}, {"t": "Welke kabel kies je?", "h": "<p>Zo kies je een kabel. Stel jezelf drie vragen: hoe ver, hoe snel, en is er storing? Thuis 40 meter naar de zolder: UTP Cat 6. Langs stroomkabels: afgeschermd, STP of FTP. Tussen twee bedrijfsgebouwen op 150 meter met 10 gigabit: dat is meer dan 100 meter, dus koper kan niet. Multimode glasvezel OM3 of OM4 haalt dat, en glasvezel geleidt geen stroom tussen twee gebouwen, wat bij koper gevaarlijk kan zijn. Gebouwen kilometers uit elkaar: singlemode.</p><div class=\"tw\"><table><thead><tr><th>Situatie</th><th>Keuze</th><th>Waarom?</th></tr></thead><tbody><tr><td>Thuis, 40 m naar de zolder</td><td>UTP Cat 6</td><td>onder 100 m, geen storing, toekomstgericht</td></tr><tr><td>Langs stroomkabels in een goot</td><td>STP of FTP</td><td>afscherming tegen storing</td></tr><tr><td>2 bedrijfsgebouwen, 150 m, 10 Gbit/s</td><td>multimode OM3/OM4</td><td>meer dan 100 m, en geen stroom tussen gebouwen</td></tr><tr><td>Gebouwen 5 km uit elkaar</td><td>singlemode</td><td>alleen singlemode haalt kilometers</td></tr><tr><td>Tv en Telenet-internet</td><td>coax</td><td>het signaal komt zo binnen</td></tr></tbody></table></div>"}], "quiz": [{"q": "Twee bedrijfsgebouwen liggen 150 m uit elkaar. Ze willen 10 Gbit/s. Welke kabel?", "o": ["UTP Cat 6A", "Multimode glasvezel OM3", "Coax"], "a": 1, "w": "Koper mag maximaal 100 m. OM3 haalt 10 Gbit/s tot 300 m, en glasvezel geleidt geen stroom tussen de gebouwen."}]}, {"n": 8, "les": 4, "t": "Wifi-standaarden", "s": [{"t": "Wifi-standaarden", "h": "<p>Wifi heet officieel 802.11, en elke nieuwe versie kreeg een letter: b, a, g, n, ac, ax en be. Omdat dat verwarrend is, kregen ze sinds 802.11n ook een gewone naam: n is Wi-Fi 4, ac is Wi-Fi 5, ax is Wi-Fi 6 en be is Wi-Fi 7. Elke versie is sneller. De snelheden in de tabel zijn theoretische maxima met alle antennes samen; in de praktijk haal je veel minder. Wi-Fi 6E gebruikt naast 2,4 en 5 GHz ook de nieuwe 6 GHz-band.</p><div class=\"tw\"><table><thead><tr><th>802.11</th><th>Nieuwe naam</th><th>Jaar</th><th>Frequentie</th><th>Max. snelheid</th></tr></thead><tbody><tr><td><code>b</code></td><td>—</td><td>1999</td><td>2,4 GHz</td><td>11 Mbit/s</td></tr><tr><td><code>a</code></td><td>—</td><td>1999</td><td>5 GHz</td><td>54 Mbit/s</td></tr><tr><td><code>g</code></td><td>—</td><td>2003</td><td>2,4 GHz</td><td>54 Mbit/s</td></tr><tr><td><code>n</code></td><td>Wi-Fi 4</td><td>2009</td><td>2,4 en 5 GHz</td><td>600 Mbit/s</td></tr><tr><td><code>ac</code></td><td>Wi-Fi 5</td><td>2014</td><td>5 GHz</td><td>tot 6,9 Gbit/s</td></tr><tr><td><code>ax</code></td><td>Wi-Fi 6 / 6E</td><td>2019</td><td>2,4 en 5 GHz (6E: ook 6)</td><td>tot 9,6 Gbit/s</td></tr><tr><td><code>be</code></td><td>Wi-Fi 7</td><td>2024</td><td>2,4, 5 en 6 GHz</td><td>tot 46 Gbit/s</td></tr></tbody></table></div><p>Theoretische maxima, met alle antennes samen. In de praktijk haal je veel minder.</p>"}, {"t": "2,4 of 5 GHz", "h": "<p>De meeste routers zenden op twee banden. 2,4 GHz heeft een groot bereik en gaat beter door muren, maar is trager en druk bezet: bluetooth en zelfs de microgolfoven gebruiken die frequentie. 5 GHz is veel sneller en heeft meer kanalen, maar het bereik is kleiner. Vergelijk het met geluid: lage tonen van een bas hoor je door de muur, hoge tonen niet. Ver weg in de tuin werkt 2,4 GHz dus beter, dicht bij de router kies je 5 GHz.</p><dl class=\"kv\"><div class=\"kv-i\"><dt>2,4 GHz</dt><dd>Groot bereik, gaat beter door muren. Maar trager en druk: ook bluetooth en de microgolfoven gebruiken het.</dd></div><div class=\"kv-i\"><dt>5 GHz</dt><dd>Veel sneller en meer kanalen. Maar kleiner bereik: muren houden het signaal sneller tegen.</dd></div></dl><p class=\"note\">Ver weg in de tuin? 2,4 GHz. Dicht bij de router en snel? 5 GHz.</p>"}, {"t": "MIMO", "h": "<p>MIMO staat voor multiple input, multiple output. De router en je toestel hebben meerdere antennes en sturen tegelijk meerdere datastromen. 2x2 betekent 2 antennes om te zenden en 2 om te ontvangen; 3x3 en 4x4 zijn sneller. Bij gewone MIMO, SU-MIMO, bedient de router de toestellen na elkaar, heel snel om de beurt. Zijn er veel gsm's en laptops tegelijk, dan moeten ze wachten. MU-MIMO, multi user, bedient meerdere toestellen tegelijk. Vergelijk het met een kassa: SU-MIMO is één kassa met een snelle kassierster, MU-MIMO opent meerdere kassa's tegelijk.</p><dl class=\"kv\"><div class=\"kv-i\"><dt>MIMO</dt><dd><b>M</b>ultiple <b>I</b>nput, <b>M</b>ultiple <b>O</b>utput: meerdere antennes zenden en ontvangen tegelijk meerdere datastromen. 2x2 = 2 zend- en 2 ontvangantennes.</dd></div><div class=\"kv-i\"><dt>SU-MIMO</dt><dd>Single User: de router bedient de toestellen <b>na elkaar</b>, heel snel om de beurt.</dd></div><div class=\"kv-i\"><dt>MU-MIMO</dt><dd>Multi User: de router bedient <b>meerdere toestellen tegelijk</b>. Minder wachten als het druk is.</dd></div></dl>"}, {"t": "Mesh-wifi", "h": "<p>In een groot huis haalt één router niet elke kamer. Een oplossing is mesh-wifi. Je zet meerdere toestellen, nodes, in huis. Eén ervan is de master en hangt aan de router. De andere verbinden draadloos met de master en met elkaar, en stellen zichzelf automatisch in. Samen vormen ze één wifi-netwerk met één naam, en je gsm wisselt ongemerkt naar de dichtste node. Volgens de cursus ligt de technische grens rond zes access points. Mesh is beter dan een gewone repeater, want een repeater herhaalt het signaal gewoon en halveert vaak de snelheid.</p><p><b>Master</b> (aan de router of modem)  →  <b>Node 2</b> (draadloos verbonden)  →  <b>Node 3</b> (draadloos verbonden)</p><p>Meerdere access points (nodes) stellen <b>zichzelf</b> in en vormen samen één wifi-netwerk met één naam. Je gsm wisselt ongemerkt naar de dichtste node. Grens: ongeveer <b>6 access points</b>. Beter dan een repeater, die het signaal gewoon herhaalt en vaak de snelheid halveert.</p>"}], "quiz": [{"q": "In een kantoor gebruiken 30 mensen tegelijk wifi. Welke techniek zorgt dat ze minder moeten wachten?", "o": ["MU-MIMO", "Een cross kabel", "Coax"], "a": 0, "w": "MU-MIMO laat de router meerdere toestellen tegelijk bedienen in plaats van na elkaar."}]}, {"n": 9, "les": 4, "t": "Wifi: beveiliging en kanalen", "s": [{"t": "Wifi-beveiliging", "h": "<p>Wifi moet versleuteld zijn, anders kan iedereen in de buurt meekijken. WEP was de eerste beveiliging, uit 1997, en is in enkele minuten te kraken: nooit meer gebruiken. WPA was een tijdelijke oplossing, WPA2 was jarenlang de standaard, en WPA3 is vandaag de veiligste. Extra tips: schakel WPS uit, dat is de knop of pincode om snel te verbinden, want die is een zwakke plek. Op school en in bedrijven gebruikt men certificaten, Enterprise: elke gebruiker logt in met eigen gegevens. Het SSID verbergen (de netwerknaam niet uitzenden) en een MAC-filter helpen een beetje, maar zijn makkelijk te omzeilen: een MAC-adres kan je nabootsen.</p><p><b>WEP</b> (1997 · in minuten te kraken)  →  <b>WPA</b> (tijdelijke oplossing)  →  <b>WPA2</b> (jarenlang de standaard)  →  <b>WPA3</b> (vandaag de veiligste)</p><dl class=\"kv\"><div class=\"kv-i\"><dt>Schakel WPS uit</dt><dd>de knop of pincode is een zwakke plek</dd></div><div class=\"kv-i\"><dt>Certificaten</dt><dd>Enterprise: elke gebruiker logt in met eigen gegevens, zoals op school</dd></div><div class=\"kv-i\"><dt>Extra, maar zwak</dt><dd>SSID verbergen en MAC-filter: makkelijk te omzeilen</dd></div></dl>"}, {"t": "Wifi-kanalen", "h": "<p>Elke wifi-band is opgedeeld in kanalen, zoals radiozenders. In de 2,4 GHz-band zijn er 13 kanalen, maar ze overlappen elkaar. Er zijn maar 3 kanalen die elkaar niet storen: 1, 6 en 11. Zenden al je buren op kanaal 1, dan kies je beter 6 of 11. In de 5 GHz-band zijn er veel meer kanalen, en die kan je bundelen tot 40, 80 of 160 MHz breed: hoe breder, hoe sneller. Meestal kiest je router zelf het beste kanaal.</p><dl class=\"kv\"><div class=\"kv-i\"><dt>2,4 GHz</dt><dd>13 kanalen, maar ze overlappen. Slechts <b>3 kanalen</b> storen elkaar niet: <b>1, 6 en 11</b>.</dd></div><div class=\"kv-i\"><dt>5 GHz</dt><dd>Veel meer kanalen: 36 tot 64 en 100 tot 140. Je kan ze bundelen tot 40, 80 of 160 MHz breed: breder is sneller.</dd></div></dl><p>Zenden al je buren op kanaal 1? Kies dan 6 of 11. Zo vermijd je storing. Meestal kiest de router automatisch.</p>"}, {"t": "Wifi detecteren", "h": "<p>Met netsh wlan show interfaces zie je de wifi waarmee je nu verbonden bent: de naam (SSID), de standaard (radiotype), de beveiliging, het kanaal en de signaalsterkte. Kanaal 44 is een 5 GHz-kanaal. Met netsh wlan show networks mode=bssid zie je alle netwerken in de buurt met hun kanaal. Op een gsm kan je een app zoals WiFi Analyzer gebruiken. Dit voorbeeld is verzonnen: in de praktijk doe je het zelf in het klaslokaal.</p><div class=\"terms\"><pre class=\"term\">C:\\&gt; netsh wlan show interfaces\nSSID . . . . . . : School-WiFi\nRadiotype  . . . : 802.11ax\nVerificatie  . . : WPA2-Enterprise\nKanaal . . . . . : 44\nSignaal  . . . . : 86%</pre></div><p><code>netsh wlan show networks mode=bssid</code> toont <b>alle</b> netwerken in de buurt met hun kanaal. Of gebruik een app zoals WiFi Analyzer.</p>"}], "quiz": [{"q": "Je wil je thuiswifi zo veilig mogelijk maken. Wat kies je?", "o": ["WEP met een lang wachtwoord", "WPA3 en WPS uit", "Alleen het SSID verbergen"], "a": 1, "w": "WEP is te kraken, het SSID verbergen is makkelijk te omzeilen. WPA3 met WPS uitgeschakeld is het veiligst."}]}, {"n": 10, "les": 4, "t": "Straalverbinding en satelliet", "s": [{"t": "Straalverbinding en satelliet", "h": "<p>Soms kan je geen kabel leggen. Een straalverbinding is een vaste verbinding tussen twee punten met radiogolven. Je hangt twee schotels die elkaar moeten kunnen zien, en dat werkt tot kilometers ver. Zo verbind je twee gebouwen zonder kabel, of brengt een provider internet naar het platteland. Satellietinternet gaat via een schotel naar een satelliet in de ruimte. Dat gebruik je op afgelegen plaatsen: op een boot, een festival, in de bergen of bij noodhulp. Nadelen: vertraging, want het signaal moet heel ver reizen, het is duur en er is vaak een datalimiet. Nieuwere satellieten in een lage baan, zoals Starlink, hebben minder vertraging.</p><dl class=\"kv\"><div class=\"kv-i\"><dt>Straalverbinding</dt><dd>Een vaste verbinding tussen <b>2 punten</b> met radiogolven (of infrarood). Twee schotels die elkaar <b>zien</b>, tot kilometers ver. Voor twee gebouwen zonder kabel, of internet op het platteland.</dd></div><div class=\"kv-i\"><dt>Satelliet</dt><dd>Internet via een schotel naar een satelliet. Voor <b>afgelegen plaatsen</b>: boten, festivals, bergen, noodhulp. Nadelen: vertraging, duur, vaak een datalimiet.</dd></div></dl>"}], "quiz": [{"q": "Een bedrijf heeft een magazijn 2 km verderop, aan de overkant van een snelweg. Graven kan niet. Wat kies je?", "o": ["Een straalverbinding", "Een UTP-kabel", "Een repeater"], "a": 0, "w": "Een straalverbinding verbindt twee vaste punten met zichtlijn over kilometers, zonder kabel."}]}];
</script>

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function MC(p,correct,wrong,x,extra){
  const o=shuffle([correct,...wrong.filter(w=>w!==correct)]);
  return Object.assign({p,kind:'mc',o,a:o.indexOf(correct),x,ans:correct},extra||{});
}

mac:{t:'MAC-adres',ch:1,gen(){

  if(k===0) return TXT(`Welk deel van <code>${mac}</code> is de OUI, het nummer van de fabrikant?`,[b.slice(0,3).map(hx2).join('-'),b.slice(0,3).map(hx2).join(':'),b.slice(0,3).map(hx2).join('')],`De eerste 3 paren zijn de OUI: <code>${b.slice(0,3).map(hx2).join('-')}</code>. De laatste 3 paren kiest de fabrikant zelf.`,{ph:'XX-XX-XX',mono:true});
  if(k===1){
    const bad=Math.random()<.5; let s=mac, why='Zes paren hexa (0–9 en A–F): geldig.';
    if(bad){const t=rand(0,2);
      if(t===0){const i=rand(0,16); if(s[i]==='-') {s=s.slice(0,i+1)+pick('GHKMXZ')+s.slice(i+2);} else s=s.slice(0,i)+pick('GHKMXZ')+s.slice(i+1); why='Er staat een letter in die niet bestaat in hexa: alleen 0–9 en A–F mogen.';}
      else if(t===1){s=b.slice(0,5).map(hx2).join('-'); why='Er staan maar 5 paren: een MAC-adres heeft er 6 (48 bits).';}
      else {s=mac+'-'+hx2(rand(0,255)); why='Er staan 7 paren: een MAC-adres heeft er 6 (48 bits).';}}

}},

// ---------- state ----------
const KEY='netwerkmedia.v1';
const state={mode:'theory',ch:1,mod:'mac',stats:{},streak:0,unlocked:false,lab:{},q:null,done:false,picked:null,quiz:{}};
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');Object.assign(state,{mode:s.mode||'theory',ch:s.ch??1,mod:s.mod&&M[s.mod]?s.mod:'mac',stats:s.stats||{},streak:s.streak||0,unlocked:!!s.unlocked,lab:s.lab||{}});}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({mode:state.mode,ch:state.ch,mod:state.mod,stats:state.stats,streak:state.streak,unlocked:state.unlocked,lab:state.lab}));}catch(e){}}
const st=id=>state.stats[id]||(state.stats[id]={g:0,n:0});
const totalOk=()=>Object.values(state.stats).reduce((s,x)=>s+x.g,0);
const progress=()=>REQ.map(id=>({id,g:st(id).g}));
const isUnlocked=()=>state.unlocked||progress().every(p=>p.g>=NEED);
function updStats(){$('#st-ok').textContent=totalOk();$('#st-streak').textContent=state.streak;const left=progress().filter(p=>p.g<NEED).length;$('#lockbadge').textContent=isUnlocked()?'open':`${left} te gaan`;}

// ---------- modes ----------
const MODES=['theory','practice','lab','test'];
function setMode(m){state.mode=m;save();MODES.forEach(x=>{$('#m-'+x).setAttribute('aria-selected',x===m);$('#v-'+x).hidden=x!==m;});
  if(m==='theory') drawChapter(); if(m==='practice'){drawMods(); if(!state.q) newQ(); else drawQ(); drawPlan();} if(m==='lab') drawLab(); if(m==='test') drawTest();}
MODES.forEach(m=>$('#m-'+m).addEventListener('click',()=>{ if(state.mode==='test'&&test.phase==='run'&&m!=='test'){ if(!test.warned){test.warned=true; drawTest('Je toets loopt nog. Klik nog eens om toch te verlaten: dat wordt geteld.'); return;} test.leaves++; } setMode(m);}));

// ---------- theory ----------
const CHAPS=[...CH,{n:11,les:0,t:'Woordenlijst',s:[],quiz:[]}];
function drawToc(){
  const g=[[3,'Netwerkapparatuur'],[4,'Kabels en draadloze media'],[0,'Naslag']];
  $('#toc').innerHTML=g.map(([les,lab])=>`<div class="nav-group"><p class="nav-label">${lab}</p>${CHAPS.filter(c=>c.les===les).map(c=>`<button type="button" class="nav-item" data-ch="${c.n}" aria-current="${c.n===state.ch}"><span>${c.n>=1&&c.n<=10?c.n+'. ':''}${c.t}</span></button>`).join('')}</div>`).join('');
  $('#toc').querySelectorAll('[data-ch]').forEach(b=>b.addEventListener('click',()=>{state.ch=+b.dataset.ch;save();drawChapter();window.scrollTo({top:0});}));
}
function drawChapter(){
  drawToc();
  const c=CHAPS.find(x=>x.n===state.ch)||CHAPS[1];
  if(c.n===11){
    $('#chapter').innerHTML=`<p class="eyebrow">Naslag</p><h2>Woordenlijst</h2><p class="lead">Alle begrippen van dit onderwerp, alfabetisch.</p><div class="sec"><label class="field"><span class="small">Zoek een begrip</span><input class="inp" id="gq" type="search" placeholder="bv. NAT" autocomplete="off"></label><dl class="gloss" id="gl"></dl></div>`;
    const draw=()=>{const f=norm($('#gq').value);$('#gl').innerHTML=GLOSS.filter(g=>!f||norm(g[0]+' '+g[1]).includes(f)).map(g=>`<div><dt>${g[0]}</dt><dd>${g[1]}</dd></div>`).join('')||'<p class="small">Geen begrip gevonden.</p>';};
    $('#gq').addEventListener('input',draw); draw(); return;
  }
  const quiz=[...c.quiz,...(QX[c.n]||[])];
  const mods=Object.keys(M).filter(id=>M[id].ch===c.n);
  $('#chapter').innerHTML=`<p class="eyebrow">${c.n?`Hoofdstuk ${c.n}`:'Herhaling'}</p><h2>${c.t}</h2>
   ${c.s.map(s=>`<section class="sec"><h3>${esc(s.t)}</h3>${s.h}</section>`).join('')}
   ${quiz.length?`<section class="sec quiz" aria-label="Test jezelf"><h3>Test jezelf</h3>${quiz.map((q,qi)=>`<div class="qz" data-q="${qi}"><p class="qq">${qi+1}. ${esc(q.q)}</p><div class="choices">${q.o.map((o,oi)=>`<button type="button" class="choice" data-o="${oi}"><span class="l">${L[oi]}</span><span>${esc(o)}</span></button>`).join('')}</div><div class="fb" hidden></div></div>`).join('')}</section>`:''}
   ${mods.length?`<section class="sec"><h3>Oefen dit hoofdstuk</h3><div class="row">${mods.map(id=>`<button type="button" class="btn sec2" data-go="${id}">${M[id].t}</button>`).join('')}</div></section>`:''}
   <div class="sec row">${c.n>0?`<button type="button" class="btn sec2" data-nav="-1">Vorig hoofdstuk</button>`:''}${c.n<11?`<button type="button" class="btn" data-nav="1">Volgend hoofdstuk</button>`:''}</div>`;
  $('#chapter').querySelectorAll('.qz').forEach(el=>{const q=quiz[+el.dataset.q];
    el.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{const o=+b.dataset.o, ok=o===q.a;
      el.querySelectorAll('.choice').forEach((x,i)=>{x.disabled=true;if(i===q.a)x.classList.add('right');else if(i===o)x.classList.add('wrong');});
      const f=el.querySelector('.fb');f.hidden=false;f.className='fb '+(ok?'good':'bad');f.innerHTML=`<b class="t">${ok?'Juist.':'Niet juist.'}</b><p>${esc(q.w)}</p>`;}));});
  $('#chapter').querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{state.mod=b.dataset.go;state.q=null;setMode('practice');}));
  $('#chapter').querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{state.ch=Math.max(0,Math.min(11,c.n+ +b.dataset.nav));save();drawChapter();window.scrollTo({top:0});}));
}

// ---------- practice ----------
function drawMods(){
  const chs=[...new Set(Object.values(M).map(m=>m.ch))].sort((a,b)=>(a===0?99:a)-(b===0?99:b));
  $('#mods').innerHTML=`<p class="small" style="margin:0 12px"><span class="req"></span>verplicht voor de eindtoets: ${NEED} juist</p>`+chs.map(ch=>`<div class="nav-group"><p class="nav-label">${CHN[ch]}</p>${Object.keys(M).filter(id=>M[id].ch===ch).map(id=>{const s=st(id),r=REQ.includes(id);return `<button type="button" class="nav-item" data-mod="${id}" aria-current="${id===state.mod}"><span>${r?'<span class="req" aria-label="verplicht"></span>':''}${M[id].t}</span><span class="badge ${r&&s.g>=NEED?'ok':''}">${s.g}/${s.n}</span></button>`;}).join('')}</div>`).join('');
  $('#mods').querySelectorAll('[data-mod]').forEach(b=>b.addEventListener('click',()=>{state.mod=b.dataset.mod;save();newQ();drawMods();if(innerWidth<820)$('#qcard').scrollIntoView({behavior:'smooth'});}));
}
let lastP='';
function newQ(){let q,i=0;do{q=M[state.mod].gen();i++;}while(q.p===lastP&&i<8);lastP=q.p;state.q=q;state.done=false;state.picked=null;drawQ();}
function answerView(q,prefix){
  if(q.kind==='mc') return `<div class="choices" role="group" aria-label="Antwoorden">${q.o.map((o,i)=>`<button type="button" class="choice" data-${prefix}="${i}"><span class="l">${L[i]}</span><span>${q.code?`<code>${esc(o)}</code>`:esc(o)}</span></button>`).join('')}</div>`;
  return `<div class="row"><label class="sr" for="${prefix}-in" hidden>Antwoord</label><input id="${prefix}-in" class="inp ${q.mono?'mono':''}" autocomplete="off" spellcheck="false" placeholder="${esc(q.ph||'je antwoord')}"></div>`;
}
const correctOf=q=>q.kind==='mc'?q.o[q.a]:q.ans;
function isRight(q,val){return q.kind==='mc'?val===q.a:q.acc.includes(norm(val));}
function drawQ(){
  const q=state.q, id=state.mod, s=st(id), r=REQ.includes(id);
  $('#qcard').innerHTML=`<div class="qhead"><div><p class="eyebrow">${CHN[M[id].ch]}</p><h2>${M[id].t}</h2></div><div class="row">${r?`<span class="pill req">Verplicht · ${Math.min(s.g,NEED)}/${NEED}</span>`:''}<span class="pill">${s.g} juist van ${s.n}</span></div></div>
  <div class="qbody"><div class="prompt">${q.p}</div>${answerView(q,'a')}<div id="fbx"></div>
  <div class="row"><button type="button" class="btn" id="check">Controleer</button><button type="button" class="btn sec2" id="nextq">Nieuwe vraag</button></div></div>`;
  const check=()=>{ if(state.done) return newQ();
    let val; if(q.kind==='mc'){ if(state.picked==null) return fbMsg('info','Kies eerst een antwoord.'); val=state.picked; } else { val=$('#a-in').value; if(!val.trim()) return fbMsg('info','Typ eerst je antwoord.'); }
    const ok=isRight(q,val); state.done=true; s.n++; if(ok){s.g++;state.streak++;} else state.streak=0; save(); updStats();
    if(q.kind==='mc') $('#qcard').querySelectorAll('[data-a]').forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('right');else if(i===val)b.classList.add('wrong');});
    else $('#a-in').disabled=true;
    fbMsg(ok?'good':'bad',(ok?'':`Het juiste antwoord: <b>${q.code?`<code>${esc(correctOf(q))}</code>`:esc(correctOf(q))}</b>. `)+q.x, ok?'Juist!':'Niet juist.');
    $('#check').textContent='Volgende vraag'; drawMods(); drawPlan();
  };
  $('#qcard').querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click',()=>{if(state.done)return;state.picked=+b.dataset.a;$('#qcard').querySelectorAll('[data-a]').forEach(x=>x.classList.toggle('sel',x===b));}));
  const inp=$('#a-in'); if(inp){inp.addEventListener('keydown',e=>{if(e.key==='Enter')check();});}
  $('#check').addEventListener('click',check);
  $('#nextq').addEventListener('click',newQ);
}
function fbMsg(kind,msg,title){$('#fbx').innerHTML=`<div class="fb ${kind}">${title?`<b class="t">${title}</b>`:''}<p>${msg}</p></div>`;}
function drawPlan(){
  const p=progress(), done=p.filter(x=>x.g>=NEED).length;
  $('#plan').innerHTML=`<div class="qhead"><div><p class="eyebrow">Op weg naar de eindtoets</p><h3>${isUnlocked()?'De eindtoets is open':`Nog ${p.length-done} verplichte oefeningen`}</h3></div><span class="pill">${done}/${p.length}</span></div>
  <div class="bar" style="margin:14px 0"><i style="width:${Math.round(done/p.length*100)}%"></i></div>
  <div class="progress">${p.map(x=>`<button type="button" class="pi ${x.g>=NEED?'ok':''}" data-mod="${x.id}" style="border:none;text-align:left"><span>${M[x.id].t}</span><b>${Math.min(x.g,NEED)}/${NEED}</b></button>`).join('')}</div>`;
  $('#plan').querySelectorAll('[data-mod]').forEach(b=>b.addEventListener('click',()=>{state.mod=b.dataset.mod;save();newQ();drawMods();window.scrollTo({top:0,behavior:'smooth'});}));
}
